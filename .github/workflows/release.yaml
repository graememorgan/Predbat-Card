name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    name: Attach card to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "CARD_VERSION = \"$TAG\"" dist/predbat-card.js || { echo "CARD_VERSION does not match tag $TAG"; exit 1; }
      - name: Upload predbat-card.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/predbat-card.js --clobber
